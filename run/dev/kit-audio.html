<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>kit-audio · звуковой стенд</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#070D36; --card:#0E1752; --card2:#131E66; --blue:#0536D4; --lime:#C0FF3F; --snow:#F2F6FF; --red:#FF3B5C; --mute:#8C97D6; }
  html,body { margin:0; background:var(--ink); color:var(--snow); font:13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { padding:18px 22px 10px; display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 18px; }
  h1 { margin:0; font-size:20px; letter-spacing:.2px; }
  h1 b { color:var(--lime); }
  .sub { color:var(--mute); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 22px 10px; }
  .chip { background:var(--card); border:1px solid #243090; border-radius:999px; padding:5px 11px; font-variant-numeric:tabular-nums; }
  .chip i { font-style:normal; color:var(--mute); margin-right:6px; }
  .ok { color:var(--lime); } .bad { color:var(--red); }
  .ladder { margin:0 22px 12px; background:var(--card); border-radius:14px; padding:10px 12px; overflow-x:auto; }
  .ladder table { border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:12px; }
  .ladder td, .ladder th { padding:3px 7px; text-align:center; white-space:nowrap; }
  .ladder th { color:var(--mute); font-weight:500; text-align:left; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(400px, 1fr)); gap:12px; padding:0 22px 22px; }
  .card { background:var(--card); border-radius:14px; padding:10px 12px 12px; box-shadow:0 0 0 1px #1c2780 inset; }
  .card.fail { box-shadow:0 0 0 2px var(--red) inset; }
  .card h3 { margin:0 0 2px; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  .card h3 span { color:var(--mute); font-weight:400; font-variant-numeric:tabular-nums; }
  .card p { margin:0 0 6px; color:var(--mute); font-size:11px; min-height:15px; }
  canvas { display:block; width:100%; border-radius:8px; background:#050a2a; image-rendering:auto; }
  #live { margin:0 22px 14px; background:var(--card2); border-radius:14px; padding:10px 12px; display:none; }
  #live.on { display:block; }
  #live button { background:var(--blue); color:var(--snow); border:0; border-radius:999px; padding:6px 12px; margin:3px; font:inherit; cursor:pointer; }
  #live button.hot { background:var(--lime); color:var(--ink); font-weight:600; }
  #live label { display:inline-flex; gap:6px; align-items:center; margin:4px 12px 4px 0; color:var(--mute); }
  #busy { padding:0 22px 12px; color:var(--mute); }
</style>
<script type="importmap">
{ "imports": { "three": "../three.module.js", "three/addons/": "../addons/" } }
</script>
</head>
<body>
<!-- ?only=a,b (фильтр тестов) ?live=1 (живые кнопки и слайдеры) ?live=auto (headless-проверка реального AudioContext) ?cols=N -->
<header><h1>Ризи RUN · <b>звуковой кит</b></h1><span class="sub" id="sub">OfflineAudioContext · детерминированные тесты · спектрограммы</span></header>
<div class="chips" id="chips"></div>
<div id="live"></div>
<div class="ladder" id="ladder" hidden></div>
<div id="busy">рендер…</div>
<div id="grid"></div>
<script type="module" src="./kit-audio.js"></script>
</body>
</html>
