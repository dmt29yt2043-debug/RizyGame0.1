<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>kit-hud · стенд интерфейса</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#9fd6ff; }
  #stage { position:fixed; inset:0; }
  #bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #notch { position:absolute; left:50%; top:10px; width:124px; height:36px; margin-left:-62px; border-radius:20px; background:#000; z-index:40; display:none; }
</style>
<script type="importmap">
{ "imports": { "three": "../three.module.js", "three/addons/": "../addons/" } }
</script>
</head>
<body>
<div id="stage"><img id="bg" alt=""><div id="notch"></div></div>
<!-- По умолчанию t=1600 и SHOT_READY; ?live=1 — реальное время.
     ?screen=title|play|pause|results|revive|settings|none  ?t=мс  ?combo=3:0.5  ?danger=0..1  ?fx=1  ?mission=on|intro|step|done|off
     ?record=1  ?tut=lane|left|right|up|down|tap  ?praise=1  ?cd=3|2|1|0  ?go=1  ?milestone=250  ?banner=…  ?toast=1  ?rm=1
     ?q=low|med|high  ?notch=1  ?touch=0|1  ?icon=rt  ?stress=1  ?selftest=1 (→ window.DEV.selftest) -->
<script type="module" src="./kit-hud.js"></script>
</body>
</html>
